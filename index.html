        const { useState, useEffect, useMemo, useRef, useLayoutEffect } = React;

        function processRichText(text, query) {
            if (!text) return '';
            // Escape basic HTML to prevent XSS
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Bold mapping: **text** -> <strong>text</strong>
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Links mapping: [Text](URL) -> <a href="URL">Text</a>
            html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-300 underline font-bold" rel="noopener noreferrer">$1</a>');
            
            // Query Highlighting
            if (query && query.trim()) {
                const escapedQuery = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escapedQuery})`, 'gi');
                html = html.replace(regex, '<mark class="bg-amber-200 dark:bg-amber-400 text-slate-900 rounded px-1 py-0.5 font-bold">$1</mark>');
            }

            // Lists mapping (Lines starting with '-' or '*')
            const lines = html.split('\n');
            let inList = false;
            let result = '';
            
            lines.forEach(line => {
                const isBullet = line.trim().startsWith('- ') || line.trim().startsWith('* ');
                if (isBullet) {
                    if (!inList) {
                        result += '<ul class="list-disc list-inside space-y-1 my-2">\n';
                        inList = true;
                    }
                    result += `  <li class="ml-4">${line.trim().substring(2)}</li>\n`;
                } else {
                    if (inList) {
                        result += '</ul>\n';
                        inList = false;
                    }
                    result += line + '<br/>\n';
                }
            });
            if (inList) result += '</ul>\n';
            
            // Remove trailing br
            return result.replace(/(<br\/>\n)$/, '');
        }

        function RichTextDisplay({ text, query, className }) {
            const html = useMemo(() => processRichText(text, query), [text, query]);
            return <div className={className} dangerouslySetInnerHTML={{ __html: html }} dir="rtl" />;
        }

        function HighlightText({ text, query }) {
            if (!query || !query.trim() || !text) return text;
            const escapedQuery = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            const parts = text.split(regex);
            return (
                <span>
                    {parts.map((part, i) => 
                        regex.test(part) ? (
                            <mark key={i} className="bg-amber-200 dark:bg-amber-400 text-slate-900 rounded px-1 py-0.5 font-bold">{part}</mark>
                        ) : (
                            part
                        )
                    )}
                </span>
            );
        }

        const HEBREW_WEEKDAYS = ['יום א׳', 'יום ב׳', 'יום ג׳', 'יום ד׳', 'יום ה׳', 'יום ו׳', 'שבת'];

        function buildWhatsAppLink(phoneInput) {
            const digits = String(phoneInput || '').replace(/\D/g, '');

        function getTodayIsoString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addDaysToIsoString(isoDateStr, days) {
            const base = isoDateStr && /^\d{4}-\d{2}-\d{2}$/.test(isoDateStr)
                ? (() => {
                    const [y, m, d] = isoDateStr.split('-').map(Number);
                    return new Date(y, m - 1, d);
                })()
                : new Date();
            base.setDate(base.getDate() + days);
            const y = base.getFullYear();
            const m = String(base.getMonth() + 1).padStart(2, '0');
            const d = String(base.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseShortageDate(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return null;
            const trimmed = dateStr.trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
                const [y, m, d] = trimmed.split('-').map(Number);
                const dt = new Date(y, m - 1, d);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(trimmed)) {
                const parts = trimmed.split('/').map(Number);
                const year = parts[2] < 100 ? 2000 + parts[2] : parts[2];
                const dt = new Date(year, parts[1] - 1, parts[0]);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            if (/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(trimmed)) {
                const parts = trimmed.split('.').map(Number);
                const year = parts[2] < 100 ? 2000 + parts[2] : parts[2];
                const dt = new Date(year, parts[1] - 1, parts[0]);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            if (/^\d{1,2}\/\d{1,2}$/.test(trimmed)) {
                const [d, m] = trimmed.split('/').map(Number);
                const now = new Date();
                let year = now.getFullYear();
                const currentMonth = now.getMonth() + 1;
                if (currentMonth <= 3 && m >= 10) {
                    year -= 1;
                } else if (currentMonth >= 10 && m <= 3) {
                    year += 1;
                }
                const dt = new Date(year, m - 1, d);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            if (/^\d{1,2}\.\d{1,2}$/.test(trimmed)) {
                const [d, m] = trimmed.split('.').map(Number);
                const now = new Date();
                let year = now.getFullYear();
                const currentMonth = now.getMonth() + 1;
                if (currentMonth <= 3 && m >= 10) {
                    year -= 1;
                } else if (currentMonth >= 10 && m <= 3) {
                    year += 1;
                }
                const dt = new Date(year, m - 1, d);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            if (!isNaN(Date.parse(trimmed))) {
                const dt = new Date(trimmed);
                dt.setHours(0, 0, 0, 0);
                return dt;
            }
            return null;
        }

        function isShortageDatePassed(dateStr) {
            const target = parseShortageDate(dateStr);
            if (!target) return true;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return target < today;
        }

        function cleanShortagesData(raw) {
            if (!raw) return { classVisits: [], independentVisitors: [], stewards: [] };
            const types = ['classVisits', 'independentVisitors', 'stewards'];
            const cleaned = {};
            types.forEach(type => {
                const list = Array.isArray(raw[type]) ? raw[type] : [];
                cleaned[type] = list.filter(d => !isShortageDatePassed(d));
            });
            return cleaned;
        }

        function formatShortageDateDisplay(dateStr) {
            if (!dateStr) return '';
            const parsed = parseShortageDate(dateStr);
            if (parsed) {
                const d = String(parsed.getDate()).padStart(2, '0');
                const m = String(parsed.getMonth() + 1).padStart(2, '0');
                return `${d}/${m}`;
            }
            const trimmed = dateStr.trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
                const [, m, d] = trimmed.split('-');
                return `${d}/${m}`;
            }
            return trimmed;
        }

        function getShortageDayName(dateStr) {
            const parsed = parseShortageDate(dateStr);
            if (!parsed) return '';
            return HEBREW_WEEKDAYS[parsed.getDay()] || '';
        }

        function getActiveSortedDates(datesArray) {
            if (!Array.isArray(datesArray)) return [];
            return datesArray
                .filter(d => !isShortageDatePassed(d))
                .sort((a, b) => {
                    const da = parseShortageDate(a);
                    const db = parseShortageDate(b);
                    if (!da || !db) return 0;
                    return da - db;
                });
        }

        function getRelativeDateText(dateStr) {
            if (!dateStr) return '';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const pubDate = new Date(dateStr);
            pubDate.setHours(0, 0, 0, 0);
            const diffDays = Math.floor((today - pubDate) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'פורסם היום';
            if (diffDays === 1) return 'פורסם אתמול';
            if (diffDays > 1) return `פורסם לפני ${diffDays} ימים`;
            return `מיועד ל-${formatShortageDateDisplay(dateStr)}`;
        }

        function compressImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('שגיאה בקריאת קובץ התמונה'));
                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('קובץ התמונה אינו תקין'));
                    img.onload = () => {
                        const MAX_DIM = 1200;
                        const MAX_DATA_URL_LENGTH = 850000; // Safe margin below Firestore 1MB document limit
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width >= height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let quality = 0.82;
                        let dataUrl = '';

                        for (let attempt = 0; attempt < 5; attempt++) {
                            canvas.width = width;
                            canvas.height = height;
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                            if (dataUrl.length <= MAX_DATA_URL_LENGTH) {
                                break;
                            }
                            quality = Math.max(0.45, quality - 0.12);
                            width = Math.round(width * 0.8);
                            height = Math.round(height * 0.8);
                        }

                        if (dataUrl.length > MAX_DATA_URL_LENGTH) {
                            reject(new Error('התמונה גדולה מדי גם לאחר כיווץ. נסו לבחור תמונה קטנה יותר.'));
                        } else {
                            resolve(dataUrl);
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function TvNoticeSlide({ notice, cat, currentTvIndex, formatShortageDateDisplay, getRelativeDateText }) {
            const textColRef = useRef(null);
            const titleRef = useRef(null);
            const contentWrapperRef = useRef(null);
            const [fitMetrics, setFitMetrics] = useState({
                contentSize: 44,
                titleSize: 64,
                boxPadding: 28,
                gap: 18,
                needsScroll: false
            });
            const [resizeTick, setResizeTick] = useState(0);

            useEffect(() => {
                const handleResize = () => setResizeTick(t => t + 1);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useLayoutEffect(() => {
                const col = textColRef.current;
                if (!col) return;

                const MIN_FONT = 22;
                const MAX_FONT = 68;

                // Ensure content box does not shrink artificially during height measurement
                if (contentWrapperRef.current) {
                    contentWrapperRef.current.style.flexShrink = '0';
                }

                const applyTestSize = (size) => {
                    const titlePx = Math.round(size * 1.45);
                    const padPx = Math.max(14, Math.round(size * 0.65));
                    const gapPx = Math.max(12, Math.round(size * 0.45));

                    col.style.gap = `${gapPx}px`;
                    if (titleRef.current) {
                        titleRef.current.style.fontSize = `${titlePx}px`;
                        titleRef.current.style.lineHeight = '1.2';
                    }
                    if (contentWrapperRef.current) {
                        contentWrapperRef.current.style.fontSize = `${size}px`;
                        contentWrapperRef.current.style.lineHeight = '1.45';
                        contentWrapperRef.current.style.padding = `${padPx}px`;
                    }
                };

                // Binary search for the largest font size where the entire notice fits on screen
                let low = MIN_FONT;
                let high = MAX_FONT;
                let best = MIN_FONT;

                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    applyTestSize(mid);
                    if (col.scrollHeight <= col.clientHeight + 1) {
                        best = mid;
                        low = mid + 1;
                    } else {
                        high = mid - 1;
                    }
                }

                applyTestSize(best);
                const stillOverflows = col.scrollHeight > col.clientHeight + 2;

                if (contentWrapperRef.current) {
                    contentWrapperRef.current.style.flexShrink = stillOverflows ? '1' : '0';
                }

                setFitMetrics({
                    contentSize: best,
                    titleSize: Math.round(best * 1.45),
                    boxPadding: Math.max(10, Math.round(best * 0.65)),
                    gap: Math.max(8, Math.round(best * 0.45)),
                    needsScroll: stillOverflows
                });
            }, [notice.id, notice.title, notice.content, notice.imageUrl, currentTvIndex, resizeTick]);

            return (
                <div 
                    key={`${notice.id}-${currentTvIndex}`}
                    className="animate-tv-fade flex-1 min-w-0 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 items-stretch bg-white border border-slate-200 rounded-3xl p-5 sm:p-8 relative overflow-hidden shadow-lg"
                >
                    <div className="absolute top-0 left-0 right-0 h-3" style={{ backgroundColor: cat.color }}></div>

                    <div 
                        ref={textColRef}
                        style={{ gap: `${fitMetrics.gap}px` }}
                        className={`${notice.imageUrl ? 'lg:col-span-7' : 'lg:col-span-12'} flex flex-col justify-center h-full min-h-0 overflow-hidden`}
                    >
                        <div className="flex items-center gap-3 shrink-0">
                            <span className="px-5 py-2 rounded-xl text-lg sm:text-xl font-bold shadow-sm" style={{ backgroundColor: cat.bg, color: cat.text }}>
                                {cat.label}
                            </span>
                            {notice.pinned && (
                                <span className="bg-amber-100 text-amber-800 border border-amber-300 px-4 py-1.5 rounded-xl text-base sm:text-lg font-bold">
                                    📌 נעוץ
                                </span>
                            )}
                        </div>

                        <h2 
                            ref={titleRef}
                            style={{ fontSize: `${fitMetrics.titleSize}px`, lineHeight: 1.2 }}
                            className="font-extrabold text-slate-900 shrink-0"
                        >
                            {notice.title}
                        </h2>

                        {notice.content && notice.content.trim() && (
                            <div
                                ref={contentWrapperRef}
                                style={{ 
                                    fontSize: `${fitMetrics.contentSize}px`, 
                                    lineHeight: 1.45, 
                                    padding: `${fitMetrics.boxPadding}px` 
                                }}
                                className={`bg-slate-50 rounded-2xl border border-slate-200 min-h-0 ${fitMetrics.needsScroll ? 'overflow-y-auto' : 'shrink-0 overflow-hidden'}`}
                            >
                                <RichTextDisplay 
                                    text={notice.content}
                                    className="text-slate-800 font-medium"
                                />
                            </div>
                        )}

                        <div className="text-slate-500 text-base sm:text-lg font-medium shrink-0">
                            פורסם: <span dir="ltr">{formatShortageDateDisplay(notice.createdAt)}</span> ({getRelativeDateText(notice.createdAt)})
                        </div>
                    </div>

                    {notice.imageUrl && (
                        <div className="lg:col-span-5 h-full min-h-0 flex items-center justify-center">
                            <div className="w-full h-full max-h-full rounded-2xl overflow-hidden border border-slate-200 shadow-md bg-slate-50 flex items-center justify-center p-2">
                                <img 
                                    src={notice.imageUrl} 
                                    alt="" 
                                    onLoad={() => setResizeTick(t => t + 1)}
                                    className="w-full h-full object-contain rounded-xl" 
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TvSidebarToc({ notices, activeIndex, onSelect }) {
            const listRef = useRef(null);

            useEffect(() => {
                if (!listRef.current) return;
                const activeEl = listRef.current.querySelector('[data-active="true"]');
                if (activeEl) {
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, [activeIndex, notices.length]);

            return (
                <aside
                    ref={listRef}
                    className="w-full lg:w-72 xl:w-80 shrink-0 bg-white border border-slate-200 rounded-3xl p-3 sm:p-4 shadow-lg flex flex-col gap-2.5 overflow-y-auto"
                >
                    {notices.map((item, idx) => {
                        const isActive = idx === activeIndex;
                        const itemCat = CATEGORIES[item.category] || CATEGORIES['מנהלה'];
                        return (
                            <button
                                key={item.id}
                                type="button"
                                data-active={isActive ? 'true' : 'false'}
                                onClick={() => onSelect(idx)}
                                className={`w-full text-right rounded-2xl p-3 sm:p-3.5 transition-all duration-300 border flex flex-col gap-1.5 shrink-0 ${
                                    isActive
                                        ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-400/70'
                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200/80'
                                }`}
                            >
                                <div className="flex items-center justify-between gap-2 w-full">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <span
                                            className="w-2.5 h-2.5 rounded-full shrink-0"
                                            style={{ backgroundColor: isActive ? '#ffffff' : itemCat.color }}
                                        ></span>
                                        <span className={`text-xs font-mono font-bold ${isActive ? 'text-emerald-100' : 'text-slate-400'}`}>
                                            {idx + 1}
                                        </span>
                                    </div>
                                    {isActive && (
                                        <span className="text-[11px] font-bold bg-white/20 text-white px-2 py-0.5 rounded-full shrink-0">
                                            מוצג כעת
                                        </span>
                                    )}
                                </div>
                                <div className={`text-sm sm:text-base font-extrabold leading-snug line-clamp-2 ${isActive ? 'text-white' : 'text-slate-800'}`}>
                                    {item.title}
                                </div>
                            </button>
                        );
                    })}
                </aside>
            );
        }

        function App() {
            const [notices, setNotices] = useState(() => {
                const saved = localStorage.getItem('garden_notices');
                if (saved) return JSON.parse(saved);
                if (window.INITIAL_EXPORTED_NOTICES) return window.INITIAL_EXPORTED_NOTICES;
                return INITIAL_NOTICES;
            });

            const [shiftShortages, setShiftShortages] = useState(() => {
                const saved = localStorage.getItem('garden_shift_shortages');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const cleaned = cleanShortagesData(parsed);
                        if (cleaned) return cleaned;
                    } catch (e) {}
                }
                if (window.INITIAL_EXPORTED_SHORTAGES) {
                    const cleaned = cleanShortagesData(window.INITIAL_EXPORTED_SHORTAGES);
                    if (cleaned) return cleaned;
                }
                return cleanShortagesData(INITIAL_SHORTAGES);
            });
            const [isShortagesOpen, setIsShortagesOpen] = useState(false);

            const [whatsappNumbers, setWhatsappNumbers] = useState(() => {
                const saved = localStorage.getItem('garden_whatsapp_numbers');
                if (saved) return { ...INITIAL_WHATSAPP_NUMBERS, ...JSON.parse(saved) };
                return INITIAL_WHATSAPP_NUMBERS;
            });
            const [isEditingWhatsapp, setIsEditingWhatsapp] = useState(false);
            const [whatsappDraft, setWhatsappDraft] = useState(INITIAL_WHATSAPP_NUMBERS);

            const [isCloudConnected, setIsCloudConnected] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('garden_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });
            const [adminPassInput, setAdminPassInput] = useState('');
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [showWhatsNewModal, setShowWhatsNewModal] = useState(false);
            const [showExitConfirmModal, setShowExitConfirmModal] = useState(false);
            const [deletingNoticeId, setDeletingNoticeId] = useState(null);
            const [adminError, setAdminError] = useState('');

            useEffect(() => {
                localStorage.setItem('garden_dark_mode', JSON.stringify(darkMode));
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Two main views: 'weekly' (Notices from last week) and 'all' (All notices)
            const [viewMode, setViewMode] = useState('weekly'); // 'weekly', 'all', 'tv', 'archive'
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [selectedSubCategories, setSelectedSubCategories] = useState([]);
            const [timeFilter, setTimeFilter] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            const [currentTvIndex, setCurrentTvIndex] = useState(0);
            const [isAutoScrolling, setIsAutoScrolling] = useState(true);
            const [tvDuration, setTvDuration] = useState(25000);
            const [timeString, setTimeString] = useState('');
            const [weather, setWeather] = useState({ temp: null, code: null });

            const [showFormModal, setShowFormModal] = useState(false);
            const [editingNotice, setEditingNotice] = useState(null);
            const [addingShortageType, setAddingShortageType] = useState(null);
            const [newShortageDate, setNewShortageDate] = useState('');
            const [isCompressingImage, setIsCompressingImage] = useState(false);
            const [imageUploadError, setImageUploadError] = useState('');

            const contentTextareaRef = useRef(null);
            const [showLinkBuilder, setShowLinkBuilder] = useState(false);
            const [linkTextInput, setLinkTextInput] = useState('');
            const [linkUrlInput, setLinkUrlInput] = useState('');

            const [formData, setFormData] = useState({
                title: '',
                content: '',
                category: 'מנהלה',
                subCategory: '',
                pinned: false,
                showOnTv: true,
                createdAt: new Date().toISOString().split('T')[0],
                expiresAt: '',
                imageUrl: ''
            });

            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.8928&longitude=34.8113&current_weather=true');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.current_weather) {
                                setWeather({
                                    temp: Math.round(data.current_weather.temperature),
                                    code: data.current_weather.weathercode
                                });
                            }
                        }
                    } catch (e) {
                        console.warn('Weather fetch error:', e);
                    }
                };
                fetchWeather();
                const timer = setInterval(fetchWeather, 1800000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                let unsubNotices = null;
                let unsubShortages = null;
                let unsubWhatsapp = null;

                const initFirebase = async () => {
                    if (!window.firebaseDb || !window.firebaseAuthReady) return;

                    try {
                        await window.firebaseAuthReady;
                        const { collection, doc, onSnapshot } = window.firestoreTools;
                        const db = window.firebaseDb;

                        const noticesColRef = collection(db, 'clore_notices');
                        unsubNotices = onSnapshot(noticesColRef, (snapshot) => {
                            const items = [];
                            snapshot.forEach((docSnap) => {
                                items.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            if (items.length > 0) {
                                setNotices(items);
                            }
                            setIsCloudConnected(true);
                        }, (err) => {
                            console.warn("Firestore notices snapshot error:", err);
                        });

                        const shortagesDocRef = doc(db, 'clore_settings', 'shortages');
                        unsubShortages = onSnapshot(shortagesDocRef, (docSnap) => {
                            if (docSnap.exists()) {
                                const cloudData = docSnap.data() || {};
                                const cleaned = cleanShortagesData(cloudData);
                                const types = ['classVisits', 'independentVisitors', 'stewards'];
                                const hasExpired = types.some(t => (cloudData[t] || []).length !== (cleaned[t] || []).length);
                                setShiftShortages(cleaned);
                                if (hasExpired) {
                                    syncShortagesToCloud(cleaned);
                                }
                            }
                        }, (err) => {
                            console.warn("Firestore shortages snapshot error:", err);
                        });

                        const whatsappDocRef = doc(db, 'clore_settings', 'whatsapp_numbers');
                        unsubWhatsapp = onSnapshot(whatsappDocRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setWhatsappNumbers(prev => ({ ...prev, ...docSnap.data() }));
                            }
                        }, (err) => {
                            console.warn("Firestore whatsapp snapshot error:", err);
                        });
                    } catch (err) {
                        console.error("Firebase Auth / Sync Error:", err);
                    }
                };

                initFirebase();

                return () => {
                    if (unsubNotices) unsubNotices();
                    if (unsubShortages) unsubShortages();
                    if (unsubWhatsapp) unsubWhatsapp();
                };
            }, []);

            useEffect(() => {
                localStorage.setItem('garden_notices', JSON.stringify(notices));
            }, [notices]);

            useEffect(() => {
                localStorage.setItem('garden_shift_shortages', JSON.stringify(shiftShortages));
            }, [shiftShortages]);

            useEffect(() => {
                localStorage.setItem('garden_whatsapp_numbers', JSON.stringify(whatsappNumbers));
            }, [whatsappNumbers]);

            // Auto-clean passed shortage dates on load, change, and periodically
            useEffect(() => {
                const pruneExpiredShortages = () => {
                    const types = ['classVisits', 'independentVisitors', 'stewards'];
                    let hasExpired = false;
                    const cleaned = { ...shiftShortages };

                    types.forEach(type => {
                        const list = shiftShortages[type] || [];
                        const filtered = list.filter(d => !isShortageDatePassed(d));
                        if (filtered.length !== list.length) {
                            hasExpired = true;
                            cleaned[type] = filtered;
                        }
                    });

                    if (hasExpired) {
                        setShiftShortages(cleaned);
                        syncShortagesToCloud(cleaned);
                    }
                };

                pruneExpiredShortages();
                const periodicCheck = setInterval(pruneExpiredShortages, 60000);
                return () => clearInterval(periodicCheck);
            }, [shiftShortages]);

            const totalShortagesCount = useMemo(() => {
                const c1 = getActiveSortedDates(shiftShortages?.classVisits).length;
                const c2 = getActiveSortedDates(shiftShortages?.independentVisitors).length;
                const c3 = getActiveSortedDates(shiftShortages?.stewards).length;
                return c1 + c2 + c3;
            }, [shiftShortages]);

            const activeNotices = useMemo(() => {
                return notices.filter(n => !n.archived);
            }, [notices]);

            const archivedNotices = useMemo(() => {
                return notices.filter(n => n.archived);
            }, [notices]);

            // Filter notices for last week (7 days)
            const weeklyNotices = useMemo(() => {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                weekAgo.setHours(0, 0, 0, 0);
                return activeNotices.filter(n => {
                    if (n.pinned) return true;
                    const d = new Date(n.createdAt);
                    return d >= weekAgo;
                });
            }, [activeNotices]);

            const displayedNotices = useMemo(() => {
                const baseList = viewMode === 'weekly' ? weeklyNotices : activeNotices;
                return baseList.filter(notice => {
                    if (selectedCategories.length > 0) {
                        if (!selectedCategories.includes(notice.category)) return false;
                        if (notice.category === 'מתחמי הגן' && selectedSubCategories.length > 0) {
                            if (!selectedSubCategories.includes(notice.subCategory)) return false;
                        }
                    }
                    if (timeFilter === 'lastWeek') {
                        if (notice.pinned) return true;
                        const noticeDate = new Date(notice.createdAt);
                        const weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        if (noticeDate < weekAgo) return false;
                    }
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase();
                        const titleMatch = notice.title?.toLowerCase().includes(q);
                        const contentMatch = notice.content?.toLowerCase().includes(q);
                        if (!titleMatch && !contentMatch) return false;
                    }
                    return true;
                }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            }, [activeNotices, weeklyNotices, viewMode, selectedCategories, selectedSubCategories, timeFilter, searchQuery]);

            const toggleCategorySelection = (catKey) => {
                setSelectedCategories(prev => {
                    const exists = prev.includes(catKey);
                    if (exists) {
                        if (catKey === 'מתחמי הגן') {
                            setSelectedSubCategories([]);
                        }
                        return prev.filter(item => item !== catKey);
                    }
                    return [...prev, catKey];
                });
            };

            const toggleSubCategorySelection = (subKey) => {
                setSelectedSubCategories(prev =>
                    prev.includes(subKey)
                        ? prev.filter(item => item !== subKey)
                        : [...prev, subKey]
                );
            };

            const syncNoticeToCloud = async (notice) => {
                if (!window.firebaseDb) return;
                try {
                    if (window.firebaseAuthReady) {
                        await window.firebaseAuthReady;
                    }
                    const { doc, setDoc } = window.firestoreTools;
                    const noticeDocRef = doc(window.firebaseDb, 'clore_notices', notice.id);
                    await setDoc(noticeDocRef, notice);
                } catch (e) {
                    console.error("Cloud save notice error:", e);
                }
            };

            const deleteNoticeFromCloud = async (id) => {
                if (!window.firebaseDb) return;
                try {
                    if (window.firebaseAuthReady) {
                        await window.firebaseAuthReady;
                    }
                    const { doc, deleteDoc } = window.firestoreTools;
                    const noticeDocRef = doc(window.firebaseDb, 'clore_notices', id);
                    await deleteDoc(noticeDocRef);
                } catch (e) {
                    console.error("Cloud delete notice error:", e);
                }
            };

            const syncShortagesToCloud = async (updatedShortages) => {
                if (!window.firebaseDb) return;
                try {
                    if (window.firebaseAuthReady) {
                        await window.firebaseAuthReady;
                    }
                    const { doc, setDoc } = window.firestoreTools;
                    const shortagesDocRef = doc(window.firebaseDb, 'clore_settings', 'shortages');
                    await setDoc(shortagesDocRef, updatedShortages);
                } catch (e) {
                    console.error("Cloud save shortages error:", e);
                }
            };

            const syncWhatsappToCloud = async (updatedNumbers) => {
                if (!window.firebaseDb) return;
                try {
                    if (window.firebaseAuthReady) {
                        await window.firebaseAuthReady;
                    }
                    const { doc, setDoc } = window.firestoreTools;
                    const whatsappDocRef = doc(window.firebaseDb, 'clore_settings', 'whatsapp_numbers');
                    await setDoc(whatsappDocRef, updatedNumbers);
                } catch (e) {
                    console.error("Cloud save whatsapp error:", e);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setTimeString(now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // האזנה למקש Escape ליציאה מתצוגת טלוויזיה בחזרה למודעות מהשבוע האחרון
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && viewMode === 'tv') {
                        setViewMode('weekly');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [viewMode]);

            const tvNotices = useMemo(() => {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                weekAgo.setHours(0, 0, 0, 0);

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                return activeNotices
                    .filter(n => {
                        if (n.showOnTv === false) return false;
                        if (n.pinned) {
                            if (n.expiresAt) {
                                const exp = new Date(n.expiresAt);
                                exp.setHours(0, 0, 0, 0);
                                if (exp < today) return false;
                            }
                            return true;
                        }
                        const d = new Date(n.createdAt);
                        return d >= weekAgo;
                    })
                    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            }, [activeNotices]);

            useEffect(() => {
                if (viewMode !== 'tv' || !isAutoScrolling || tvNotices.length === 0) return;

                const currentNotice = tvNotices[currentTvIndex % tvNotices.length];
                const text = `${currentNotice?.title || ''} ${currentNotice?.content || ''}`;
                const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
                const calculatedDuration = Math.min(45000, Math.max(12000, 10000 + wordCount * 350));
                setTvDuration(calculatedDuration);

                const timer = setTimeout(() => {
                    setCurrentTvIndex(prev => (prev + 1) % tvNotices.length);
                }, calculatedDuration);

                return () => clearTimeout(timer);
            }, [viewMode, isAutoScrolling, currentTvIndex, tvNotices]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassInput === '1999') {
                    setIsAdmin(true);
                    setShowAdminModal(false);
                    setAdminPassInput('');
                    setAdminError('');
                } else {
                    setAdminError('סיסמה שגויה, נסה שנית');
                }
            };

            const handleOpenForm = (notice = null) => {
                setImageUploadError('');
                setIsCompressingImage(false);
                if (notice) {
                    setEditingNotice(notice);
                    setFormData({
                        title: notice.title || '',
                        content: notice.content || '',
                        category: notice.category || 'מנהלה',
                        subCategory: notice.category === 'מתחמי הגן' ? (notice.subCategory || '') : '',
                        pinned: !!notice.pinned,
                        showOnTv: notice.showOnTv !== false,
                        createdAt: notice.createdAt || getTodayIsoString(),
                        expiresAt: notice.expiresAt || '',
                        imageUrl: notice.imageUrl || ''
                    });
                } else {
                    const todayStr = getTodayIsoString();
                    setEditingNotice(null);
                    setFormData({
                        title: '',
                        content: '',
                        category: 'מנהלה',
                        subCategory: '',
                        pinned: false,
                        showOnTv: true,
                        createdAt: todayStr,
                        expiresAt: addDaysToIsoString(todayStr, 10),
                        imageUrl: ''
                    });
                }
                setShowLinkBuilder(false);
                setLinkTextInput('');
                setLinkUrlInput('');
                setShowFormModal(true);
            };

            const applyBoldFormat = () => {
                const el = contentTextareaRef.current;
                const currentText = formData.content || '';
                if (!el) {
                    setFormData(prev => ({ ...prev, content: `${currentText}**טקסט מודגש**` }));
                    return;
                }
                const start = el.selectionStart ?? currentText.length;
                const end = el.selectionEnd ?? currentText.length;
                const selected = currentText.slice(start, end);
                const replacement = selected ? `**${selected}**` : '**טקסט מודגש**';
                const nextContent = currentText.slice(0, start) + replacement + currentText.slice(end);
                setFormData(prev => ({ ...prev, content: nextContent }));
                setTimeout(() => {
                    el.focus();
                    if (selected) {
                        el.setSelectionRange(start + replacement.length, start + replacement.length);
                    } else {
                        el.setSelectionRange(start + 2, start + 12);
                    }
                }, 0);
            };

            const handleOpenLinkBuilder = () => {
                if (showLinkBuilder) {
                    setShowLinkBuilder(false);
                    return;
                }
                const el = contentTextareaRef.current;
                const currentText = formData.content || '';
                const start = el ? (el.selectionStart ?? 0) : 0;
                const end = el ? (el.selectionEnd ?? 0) : 0;
                const selected = currentText.slice(start, end).trim();
                setLinkTextInput(selected);
                setLinkUrlInput('');
                setShowLinkBuilder(true);
            };

            const handleInsertLink = () => {
                const cleanUrl = linkUrlInput.trim();
                if (!cleanUrl) return;
                const formattedUrl = /^https?:\/\//i.test(cleanUrl) ? cleanUrl : `https://${cleanUrl}`;
                const displayLabel = linkTextInput.trim() || 'לחצו כאן';
                const markdownLink = `[${displayLabel}](${formattedUrl})`;

                const el = contentTextareaRef.current;
                const currentText = formData.content || '';
                const start = el ? (el.selectionStart ?? currentText.length) : currentText.length;
                const end = el ? (el.selectionEnd ?? currentText.length) : currentText.length;
                const nextContent = currentText.slice(0, start) + markdownLink + currentText.slice(end);
                setFormData(prev => ({ ...prev, content: nextContent }));
                setShowLinkBuilder(false);
                setLinkTextInput('');
                setLinkUrlInput('');
                setTimeout(() => {
                    if (el) {
                        el.focus();
                        const newCursor = start + markdownLink.length;
                        el.setSelectionRange(newCursor, newCursor);
                    }
                }, 0);
            };

            const applyBulletListFormat = () => {
                const el = contentTextareaRef.current;
                const currentText = formData.content || '';
                if (!el) {
                    const prefix = currentText && !currentText.endsWith('\n') ? '\n- ' : '- ';
                    setFormData(prev => ({ ...prev, content: `${currentText}${prefix}` }));
                    return;
                }
                const start = el.selectionStart ?? currentText.length;
                const end = el.selectionEnd ?? currentText.length;

                if (start !== end) {
                    const selected = currentText.slice(start, end);
                    const bulleted = selected
                        .split('\n')
                        .map(line => (line.trim() && !line.trim().startsWith('- ') && !line.trim().startsWith('* ') ? `- ${line}` : line))
                        .join('\n');
                    const nextContent = currentText.slice(0, start) + bulleted + currentText.slice(end);
                    setFormData(prev => ({ ...prev, content: nextContent }));
                    setTimeout(() => {
                        el.focus();
                        el.setSelectionRange(start + bulleted.length, start + bulleted.length);
                    }, 0);
                    return;
                }

                const lineStart = currentText.lastIndexOf('\n', start - 1) + 1;
                const currentLinePrefix = currentText.slice(lineStart, start);
                const insertion = currentLinePrefix.trim() === '' ? '- ' : '\n- ';
                const nextContent = currentText.slice(0, start) + insertion + currentText.slice(end);
                setFormData(prev => ({ ...prev, content: nextContent }));

                    el.focus();
                    const newCursor = start + insertion.length;
                    el.setSelectionRange(newCursor, newCursor);
                }, 0);

                    syncNoticeToCloud(newNotice);

                                        </div>

                                        {showLinkBuilder && (
                                            <div className="mb-2 p-2.5 rounded-xl bg-purple-50/70 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-800/70 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                                                <input
                                                    type="text"
                                                    value={linkTextInput}
                                                    onChange={(e) => setLinkTextInput(e.target.value)}
                                                    placeholder="טקסט להצגה (למשל: לטופס)"
                                                    className="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
                                                />
                                                <input
                                                    type="url"
                                                    dir="ltr"
                                                    value={linkUrlInput}
                                                    onChange={(e) => setLinkUrlInput(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter') {
                                                            e.preventDefault();
                                                            handleInsertLink();
                                                        }
                                                    }}
                                                    placeholder="https://..."
                                                    className="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
                                                    autoFocus
                                                />
                                                <div className="flex items-center gap-1.5 justify-end">
                                                    <button
                                                        type="button"
                                                        onClick={handleInsertLink}
                                                        className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition"
                                                    >
                                                        הוסף
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => setShowLinkBuilder(false)}
                                                        className="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 text-xs font-bold px-1.5 py-1"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        <textarea 
                                            ref={contentTextareaRef}
                                            rows={4}
                                            value={formData.content}
                                            onChange={(e) => setFormData(prev => ({ ...prev, content: e.target.value }))}
                                            className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                                            placeholder="פירוט המודעה..."
                                        ></textarea>
                                        <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1 font-medium">
                                            💡 <strong>טיפ:</strong> להדגשה: <code>**טקסט**</code> | קישור: <code>[שם](https://..)</code> | רשימה: תחילת שורה ב-<code>*</code> או <code>-</code>.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">תאריך פרסום:</label>
                                            <input 
                                                type="date"
                                                value={formData.createdAt}
                                                onChange={(e) => {
                                                    const newCreatedAt = e.target.value;
                                                    setFormData(prev => {
                                                        const shouldSyncExpiry = !editingNotice && newCreatedAt && prev.expiresAt === addDaysToIsoString(prev.createdAt, 10);
                                                        return {
                                                            ...prev,
                                                            createdAt: newCreatedAt,
                                                            expiresAt: shouldSyncExpiry ? addDaysToIsoString(newCreatedAt, 10) : prev.expiresAt
                                                        };
                                                    });
                                                }}
                                                className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">תאריך תפוגה (אופציונלי):</label>
                                            <input 
                                                type="date"
                                                value={formData.expiresAt}
                                                onChange={(e) => setFormData(prev => ({ ...prev, expiresAt: e.target.value }))}
                                                className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">תמונה (קישור URL או העלאה):</label>
                                        <input 
                                            type="text"
                                            placeholder="https://..."
                                            value={formData.imageUrl}
                                            onChange={(e) => {
                                                setImageUploadError('');
                                                setFormData(prev => ({ ...prev, imageUrl: e.target.value }));
                                            }}
                                            className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 mb-2"
                                        />
                                        <input 
                                            type="file" 
                                            accept="image/*"
                                            onChange={handleImageUpload}
                                            className="block w-full text-xs text-slate-500 dark:text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-50 dark:file:bg-purple-950 file:text-purple-700 dark:file:text-purple-300 hover:file:bg-purple-100"
                                        />
                                        {isCompressingImage && (
                                            <p className="text-[11px] text-purple-600 dark:text-purple-400 mt-1 font-bold">⏳ מכווץ ומכין את התמונה לשמירה בענן...</p>
                                        )}
                                        {imageUploadError && (
                                            <p className="text-[11px] text-rose-600 dark:text-rose-400 mt-1 font-bold">{imageUploadError}</p>
                                        )}
                                    </div>

                                    <div className="flex flex-col gap-2 pt-2">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input 
                                                type="checkbox"
                                                checked={formData.pinned}
                                                onChange={(e) => setFormData(prev => ({ ...prev, pinned: e.target.checked }))}
                                                className="rounded text-purple-600 focus:ring-purple-500"
                                            />
                                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">נעץ מודעה בראש הלוח 📌</span>
                                        </label>

                                        <div>
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input 
                                                    type="checkbox"
                                                    checked={formData.showOnTv}
                                                    onChange={(e) => setFormData(prev => ({ ...prev, showOnTv: e.target.checked }))}
                                                    className="rounded text-purple-600 focus:ring-purple-500"
                                                />
                                                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">הצג בטלוויזיה 📺</span>
                                            </label>
                                            <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1 font-medium">
                                                💡 <strong>טיפ:</strong> מודעות יוצגו במסך הטלוויזיה למשך 7 ימים. מודעות מוצמדות יוצגו עד שיפוג תוקפן.
                                            </p>
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <button 
                                            type="button"
                                            onClick={() => setShowFormModal(false)}
                                            className="text-xs font-bold text-slate-600 dark:text-slate-300 px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
                                        >
                                            ביטול
                                        </button>
                                        <button 
                                            type="submit"
                                            disabled={isCompressingImage}
                                            className="bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-bold text-xs px-5 py-2 rounded-xl shadow-sm"
                                        >
                                            {editingNotice ? 'עדכן מודעה' : 'פרסם מודעה'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
